name: Validate plugin

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  php-lint-and-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Configure PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Lint PHP
        run: find . -type f -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n 1 php -l

      - name: Run local tests when present
        shell: bash
        run: |
          shopt -s nullglob
          for test_file in tests/*.test.php; do
            php "$test_file"
          done
